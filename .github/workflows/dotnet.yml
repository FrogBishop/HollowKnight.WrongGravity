name: .NET

# Build a release package when a tag is pushed. The project targets .NET Framework 4.7.2,
# so the runner is Windows (the Linux image would need extra reference assemblies).
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download latest Modding API and Vasi references
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/restore-references.ps1

      - name: Restore dependencies
        run: dotnet restore WrongGravity.csproj

      - name: Build release
        run: dotnet build WrongGravity.csproj --no-restore -c Release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" WrongGravity.zip --title "$env:RELEASE_TAG" --notes "WrongGravity $env:RELEASE_TAG"
