name: .NET

# Build a release package when a tag is pushed. The project targets .NET Framework 4.7.2,
# so the runner is Windows (the Linux image would need extra reference assemblies).
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build release
        run: dotnet build --no-restore -c Release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" WrongGravity.zip --title "${{ github.ref_name }}" --notes "WrongGravity ${{ github.ref_name }}"
